  <text x="45" y="150" fill="#F2F5F7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="78" font-weight="650" letter-spacing="-3">Neo<tspan fill="#8BD5B0">NBS</tspan></text>
  <text x="50" y="190" fill="#B1BDC7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19">Compose. Arrange. Shape every note.</text>
