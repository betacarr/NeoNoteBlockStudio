<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-labelledby="title description">
  <title id="title">NeoNBS — Note Block Workstation</title>
  <desc id="description">An original dark cover with mint green piano-roll notes. Decorative artwork, not an application screenshot; no Minecraft assets are used.</desc>
  <defs>
    <pattern id="grid" x="724" y="48" width="48" height="24" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V24" stroke="#303C46" stroke-width="1"/>
