<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title description"><title id="title">裁剪副本范围，不删除源音符</title><desc id="description">绿色边框是当前副本使用的范围，橙色虚线是源片段结束位置。。原创操作示意，界面布局作了简化，不是应用截图。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#8bd5b0" stroke-width="1.5"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#f0c181" stroke-width="1.5"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#91bce4" stroke-width="1.5"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif}</style><rect x="1" y="1" width="998" height="458" rx="16" fill="#171d24" stroke="#3b4b59"/><text x="28" y="45" fill="#edf3f7" font-size="27" font-weight="650">裁剪副本范围，不删除源音符</text><text x="28" y="77" fill="#b0c0cd" font-size="18" font-weight="400">绿色边框是当前副本使用的范围，橙色虚线是源片段结束位置。</text><rect x="59" y="137" width="882" height="150" rx="6" fill="#171d24" stroke="#3b4b59"/><path d="M99 137L99 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M139 137L139 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M179 137L179 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M219 137L219 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M259 137L259 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M299 137L299 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M339 137L339 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M379 137L379 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M419 137L419 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M459 137L459 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M499 137L499 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M539 137L539 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M579 137L579 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M619 137L619 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M659 137L659 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M699 137L699 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M739 137L739 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M779 137L779 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M819 137L819 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M859 137L859 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M899 137L899 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M939 137L939 287" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M59 167L941 167" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M59 197L941 197" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M59 227L941 227" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M59 257L941 257" fill="none" stroke="#3b4b59" stroke-width="2"/><text x="80" y="125" fill="#b0c0cd" font-size="20" font-weight="400">当前副本的范围带</text><rect x="300" y="145" width="400" height="130" fill="#8bd5b0" fill-opacity=".08" stroke="#8bd5b0" stroke-width="2"/><rect x="296" y="145" width="8" height="130" rx="2" fill="#8bd5b0" stroke="#8bd5b0"/><rect x="696" y="145" width="8" height="130" rx="2" fill="#8bd5b0" stroke="#8bd5b0"/><rect x="120" y="206" width="65" height="19" rx="3" fill="#43515e" stroke="#43515e"/><rect x="240" y="176" width="65" height="19" rx="3" fill="#43515e" stroke="#43515e"/><rect x="360" y="206" width="65" height="19" rx="3" fill="#8bd5b0" stroke="#8bd5b0"/><rect x="480" y="176" width="65" height="19" rx="3" fill="#8bd5b0" stroke="#8bd5b0"/><rect x="600" y="206" width="65" height="19" rx="3" fill="#8bd5b0" stroke="#8bd5b0"/><rect x="760" y="176" width="65" height="19" rx="3" fill="#43515e" stroke="#43515e"/><path d="M300 165L220 165" fill="none" stroke="#f0c181" stroke-width="3" marker-end="url(#orange)"/><path d="M700 165L787 165" fill="none" stroke="#f0c181" stroke-width="3" marker-end="url(#orange)"/><path d="M844 137L844 287" fill="none" stroke="#f0c181" stroke-width="2" stroke-dasharray="7 5"/><text x="772" y="318" fill="#f0c181" font-size="19" font-weight="400">源片段结束</text><text x="76" y="325" fill="#8bd5b0" font-size="22" font-weight="600">变暗 = 起音在副本范围外；源内容仍保留</text><rect x="63" y="356" width="276" height="34" rx="6" fill="#171d24" stroke="#8bd5b0"/><text x="75" y="380" fill="#8bd5b0" font-size="19" font-weight="600">拖左右手柄：裁剪副本</text><rect x="378" y="356" width="262" height="34" rx="6" fill="#171d24" stroke="#91bce4"/><text x="390" y="380" fill="#91bce4" font-size="19" font-weight="600">循环：用独立开关控制</text><rect x="680" y="356" width="256" height="34" rx="6" fill="#171d24" stroke="#8bd5b0"/><text x="692" y="380" fill="#8bd5b0" font-size="19" font-weight="600">复制后：两份独立编辑</text><text x="63" y="433" fill="#b0c0cd" font-size="21" font-weight="400">裁短后，拉回边界即可恢复起音；已经触发的采样仍自然播完。</text></svg>
