<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="512" viewBox="0 0 1000 512" role="img" aria-labelledby="title description"><title id="title">缩放、滚动与面板大小</title><desc id="description">两轴独立：横向调时间，纵向调每个半音的高度。。原创操作示意，界面布局作了简化，不是应用截图。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#8bd5b0" stroke-width="1.5"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#f0c181" stroke-width="1.5"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#91bce4" stroke-width="1.5"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif}</style><rect x="1" y="1" width="998" height="510" rx="16" fill="#171d24" stroke="#3b4b59"/><text x="28" y="45" fill="#edf3f7" font-size="27" font-weight="650">缩放、滚动与面板大小</text><text x="28" y="77" fill="#b0c0cd" font-size="18" font-weight="400">两轴独立：横向调时间，纵向调每个半音的高度。</text><rect x="28" y="106" width="944" height="66" rx="10" fill="#222c36" stroke="#3b4b59"/><text x="47" y="145" fill="#edf3f7" font-size="23" font-weight="600">钢琴卷帘</text><rect x="257" y="120" width="273" height="34" rx="6" fill="#171d24" stroke="#8bd5b0"/><text x="269" y="144" fill="#8bd5b0" font-size="19" font-weight="600">横向    −  ━━━●━━  +</text><rect x="573" y="120" width="273" height="34" rx="6" fill="#171d24" stroke="#91bce4"/><text x="585" y="144" fill="#91bce4" font-size="19" font-weight="600">纵向    −  ━●━━━━  +</text><rect x="70" y="200" width="650" height="190" rx="6" fill="#171d24" stroke="#3b4b59"/><path d="M110 200L110 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M150 200L150 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M190 200L190 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M230 200L230 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M270 200L270 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M310 200L310 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M350 200L350 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M390 200L390 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M430 200L430 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M470 200L470 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M510 200L510 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M550 200L550 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M590 200L590 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M630 200L630 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M670 200L670 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M710 200L710 390" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M70 230L720 230" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M70 260L720 260" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M70 290L720 290" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M70 320L720 320" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M70 350L720 350" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M70 380L720 380" fill="none" stroke="#3b4b59" stroke-width="2"/><text x="90" y="226" fill="#b0c0cd" font-size="20" font-weight="400">时间标尺：按住拖动定位</text><path d="M70 244L720 244" fill="none" stroke="#3b4b59" stroke-width="2"/><rect x="136" y="325" width="103" height="18" rx="3" fill="#8bd5b0" stroke="#8bd5b0"/><rect x="270" y="265" width="103" height="18" rx="3" fill="#8bd5b0" stroke="#8bd5b0"/><rect x="404" y="295" width="143" height="18" rx="3" fill="#8bd5b0" stroke="#8bd5b0"/><path d="M135 369L399 369" fill="none" stroke="#8bd5b0" stroke-width="3" marker-end="url(#green)"/><text x="755" y="267" fill="#8bd5b0" font-size="21" font-weight="600">横向：时间宽度</text><text x="755" y="302" fill="#91bce4" font-size="21" font-weight="600">纵向：音高行距</text><text x="755" y="348" fill="#b0c0cd" font-size="19" font-weight="400">点轴名可复位</text><path d="M42 354L42 272" fill="none" stroke="#91bce4" stroke-width="3" marker-end="url(#blue)"/><rect x="70" y="399" width="650" height="10" rx="4" fill="#222c36" stroke="#3b4b59"/><rect x="70" y="399" width="250" height="10" rx="4" fill="#8bd5b0" stroke="#8bd5b0"/><rect x="728" y="200" width="10" height="190" rx="4" fill="#222c36" stroke="#3b4b59"/><rect x="728" y="236" width="10" height="68" rx="4" fill="#91bce4" stroke="#91bce4"/><text x="29" y="449" fill="#b0c0cd" font-size="20" font-weight="400">拖分隔条改面板高度  ·  中键平移  ·  滚轮上下 / Shift + 滚轮左右</text><text x="29" y="485" fill="#8bd5b0" font-size="21" font-weight="600">Ctrl / Cmd + 滚轮：横向缩放；再按 Shift：纵向缩放。</text></svg>
