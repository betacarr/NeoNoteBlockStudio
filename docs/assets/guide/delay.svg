<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="533" viewBox="0 0 1000 533" role="img" aria-labelledby="title description"><title id="title">把 Delay 变成可以导出的音符事件</title><desc id="description">先选轨道，再到检查器启用；两种模式都支持相对原声像的左右交替。。原创操作示意，界面布局作了简化，不是应用截图。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#8bd5b0" stroke-width="1.5"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#f0c181" stroke-width="1.5"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#91bce4" stroke-width="1.5"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif}</style><rect x="1" y="1" width="998" height="531" rx="16" fill="#171d24" stroke="#3b4b59"/><text x="28" y="45" fill="#edf3f7" font-size="27" font-weight="650">把 Delay 变成可以导出的音符事件</text><text x="28" y="77" fill="#b0c0cd" font-size="18" font-weight="400">先选轨道，再到检查器启用；两种模式都支持相对原声像的左右交替。</text><rect x="28" y="107" width="267" height="351" rx="10" fill="#222c36" stroke="#3b4b59"/><text x="47" y="144" fill="#edf3f7" font-size="22" font-weight="600">检查器 · Delay 回声</text><rect x="48" y="162" width="160" height="34" rx="6" fill="#171d24" stroke="#8bd5b0"/><text x="60" y="186" fill="#8bd5b0" font-size="19" font-weight="600">✓ 启用</text><text x="48" y="228" fill="#8bd5b0" font-size="23" font-weight="600">时值关联</text><text x="48" y="260" fill="#b0c0cd" font-size="20" font-weight="400">ADSR + 释放偏移</text><text x="48" y="303" fill="#91bce4" font-size="23" font-weight="600">自由尾音</text><text x="48" y="335" fill="#b0c0cd" font-size="17" font-weight="400">独立尾长，忽略音符时值</text><text x="48" y="390" fill="#edf3f7" font-size="22" font-weight="600">左右摆幅</text><text x="48" y="425" fill="#b0c0cd" font-size="19" font-weight="400">相对原声像 ± 摆幅</text><rect x="314" y="107" width="658" height="193" rx="10" fill="#222c36" stroke="#3b4b59"/><text x="334" y="140" fill="#edf3f7" font-size="21" font-weight="600">时值关联：Release 可以提前开始</text><path d="M346 263L944 263" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M346 163L346 263" fill="none" stroke="#3b4b59" stroke-width="2"/><path d="M352 263L410 166 470 211 633 211 733 263" stroke="#8bd5b0" stroke-width="3" fill="none"/><text x="380" y="197" fill="#8bd5b0" font-size="19" font-weight="400">A</text><text x="434" y="185" fill="#8bd5b0" font-size="19" font-weight="400">D</text><text x="546" y="200" fill="#8bd5b0" font-size="19" font-weight="400">S</text><text x="675" y="229" fill="#8bd5b0" font-size="19" font-weight="400">R</text><path d="M790 158L790 271" fill="none" stroke="#f0c181" stroke-width="2" stroke-dasharray="6 5"/><text x="805" y="181" fill="#f0c181" font-size="18" font-weight="400">原音符末尾</text><text x="805" y="243" fill="#b0c0cd" font-size="16" font-weight="400">R 结束后</text><text x="805" y="267" fill="#b0c0cd" font-size="16" font-weight="400">停止新增回声</text><rect x="314" y="317" width="658" height="141" rx="10" fill="#222c36" stroke="#3b4b59"/><text x="334" y="350" fill="#edf3f7" font-size="21" font-weight="600">例：原声像 R25，左右摆幅 50%</text><rect x="342" y="386" width="98" height="24" rx="3" fill="#8bd5b0" stroke="#8bd5b0"/><text x="346" y="437" fill="#8bd5b0" font-size="18" font-weight="400">原音 R25</text><rect x="480" y="386" width="54" height="24" rx="3" fill="#f0c181" stroke="#f0c181"/><text x="479" y="435" fill="#f0c181" font-size="18" font-weight="400">L25</text><path d="M545 395L571 395" fill="none" stroke="#8bd5b0" stroke-width="3" marker-end="url(#green)"/><rect x="595" y="386" width="54" height="19" rx="3" fill="#91bce4" stroke="#91bce4"/><text x="594" y="435" fill="#91bce4" font-size="18" font-weight="400">R75</text><path d="M660 395L686 395" fill="none" stroke="#8bd5b0" stroke-width="3" marker-end="url(#green)"/><rect x="710" y="386" width="54" height="14" rx="3" fill="#f0c181" stroke="#f0c181"/><text x="709" y="435" fill="#f0c181" font-size="18" font-weight="400">L25</text><path d="M775 395L801 395" fill="none" stroke="#8bd5b0" stroke-width="3" marker-end="url(#green)"/><rect x="825" y="386" width="54" height="9" rx="3" fill="#91bce4" stroke="#91bce4"/><text x="824" y="435" fill="#91bce4" font-size="18" font-weight="400">R75</text><text x="28" y="505" fill="#8bd5b0" font-size="20" font-weight="600">包络只改变派生回声的力度；源 MIDI 保留，原音与回声采样都自然播完。</text></svg>
