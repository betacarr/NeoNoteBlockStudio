<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="466" viewBox="0 0 1000 466" role="img" aria-labelledby="title description"><title id="title">NBSX 用于继续编辑，NBS 用于互通</title><desc id="description">先保存母版，再根据接收工具选择 NBS 版本与 TPS 预设。。原创操作示意，界面布局作了简化，不是应用截图。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#8bd5b0" stroke-width="1.5"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#f0c181" stroke-width="1.5"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#91bce4" stroke-width="1.5"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif}</style><rect x="1" y="1" width="998" height="464" rx="16" fill="#171d24" stroke="#3b4b59"/><text x="28" y="45" fill="#edf3f7" font-size="27" font-weight="650">NBSX 用于继续编辑，NBS 用于互通</text><text x="28" y="77" fill="#b0c0cd" font-size="18" font-weight="400">先保存母版，再根据接收工具选择 NBS 版本与 TPS 预设。</text><rect x="28" y="108" width="399" height="286" rx="10" fill="#222c36" stroke="#3b4b59"/><circle cx="51" cy="136" r="16" fill="#8bd5b0"/><text x="45" y="143" fill="#171d24" font-size="20" font-weight="700">1</text><text x="76" y="144" fill="#edf3f7" font-size="24" font-weight="600">保存可编辑母版</text><rect x="50" y="167" width="188" height="34" rx="6" fill="#171d24" stroke="#8bd5b0"/><text x="62" y="191" fill="#8bd5b0" font-size="19" font-weight="600">保存 / 另存为</text><text x="51" y="247" fill="#8bd5b0" font-size="39" font-weight="650">.nbsx</text><text x="51" y="293" fill="#edf3f7" font-size="22" font-weight="400">片段 · 源信息 · 混音</text><text x="51" y="334" fill="#b0c0cd" font-size="21" font-weight="400">Delay 参数与单音符属性</text><path d="M441 251L483 251" fill="none" stroke="#8bd5b0" stroke-width="3" marker-end="url(#green)"/><rect x="502" y="108" width="470" height="286" rx="10" fill="#222c36" stroke="#3b4b59"/><circle cx="525" cy="136" r="16" fill="#8bd5b0"/><text x="519" y="143" fill="#171d24" font-size="20" font-weight="700">2</text><text x="550" y="144" fill="#edf3f7" font-size="24" font-weight="600">导出 NBS</text><rect x="525" y="167" width="100" height="34" rx="6" fill="#171d24" stroke="#8bd5b0"/><text x="537" y="191" fill="#8bd5b0" font-size="19" font-weight="600">NBS</text><text x="648" y="191" fill="#b0c0cd" font-size="20" font-weight="400">MID     WAV</text><text x="526" y="247" fill="#edf3f7" font-size="22" font-weight="600">TPS 换算预设</text><text x="526" y="283" fill="#8bd5b0" font-size="21" font-weight="400">BPM ÷ 7.5 → 每拍 8 tick</text><text x="526" y="315" fill="#91bce4" font-size="21" font-weight="400">BPM ÷ 5 → 每拍 12 tick</text><rect x="761" y="342" width="186" height="34" rx="6" fill="#171d24" stroke="#8bd5b0"/><text x="773" y="366" fill="#8bd5b0" font-size="19" font-weight="600">导出文件…</text><text x="28" y="439" fill="#b0c0cd" font-size="20" font-weight="400">点击「导出文件…」会自动检查并保存；Delay 回声写入 NBS 的真实音符。</text></svg>
