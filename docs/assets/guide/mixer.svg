<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="504" viewBox="0 0 1000 504" role="img" aria-labelledby="title description"><title id="title">选轨道，找对应混音通道</title><desc id="description">底部「混音器」或「视图 → 混音器」打开；加载声音后播放查看电平。。原创操作示意，界面布局作了简化，不是应用截图。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#8bd5b0" stroke-width="1.5"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#f0c181" stroke-width="1.5"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#91bce4" stroke-width="1.5"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif}</style><rect x="1" y="1" width="998" height="502" rx="16" fill="#171d24" stroke="#3b4b59"/><text x="28" y="45" fill="#edf3f7" font-size="27" font-weight="650">选轨道，找对应混音通道</text><text x="28" y="77" fill="#b0c0cd" font-size="18" font-weight="400">底部「混音器」或「视图 → 混音器」打开；加载声音后播放查看电平。</text><rect x="28" y="108" width="279" height="286" rx="10" fill="#222c36" stroke="#3b4b59"/><text x="47" y="145" fill="#edf3f7" font-size="23" font-weight="600">编曲区轨道</text><rect x="45" y="168" width="245" height="55" rx="10" fill="#222c36" stroke="#3b4b59"/><text x="60" y="203" fill="#edf3f7" font-size="22" font-weight="400">01  演示旋律</text><rect x="45" y="235" width="245" height="55" rx="10" fill="#263f37" stroke="#8bd5b0"/><text x="60" y="270" fill="#8bd5b0" font-size="22" font-weight="600">02  演示低音</text><path d="M231 264l0 29 8-8 7 14 7-4-7-13 12-1Z" fill="#edf3f7" stroke="#171d24" stroke-width="2"/><text x="47" y="347" fill="#8bd5b0" font-size="23" font-weight="600">① 点击轨道</text><path d="M316 259L374 259" fill="none" stroke="#8bd5b0" stroke-width="3" marker-end="url(#green)"/><rect x="395" y="108" width="577" height="286" rx="10" fill="#