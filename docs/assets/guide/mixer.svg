" width="7" height="61" rx="2" fill="#171d24" stroke="#3b4b59"/><rect x="602" y="324" width="56" height="34" rx="6" fill="#171d24" stroke="#91bce4"/><text x="614" y="348" fill="#91bce4" font-size="19" font-weight="600">M</text><rect x="675" y="324" width="56" height="34" rx="6" fill="#171d24" stroke="#f0c181"/><text x="687" y="348" fill="#f0c181" font-size="19" font-weight="600">S</text><rect x="764" y="166" width="154" height="204" rx="10" fill="#171d24" stroke="#3b4b59"/><text x="781" y="195" fill="#edf3f7" font-size="21" font-weight="600">总输出</text><text x="778" y="236" fill="#b0c0cd" font-size="17" font-weight="400">音量</text><text x="858" y="236" fill="#b0c0cd" font-size="17" font-weight="400">电平</text><path d="M814 250L814 322" fill="none" stroke="#3b4b59" stroke-width="2"/><rect x="797" y="281" width="34" height="13" rx="3" fill="#8bd5b0" stroke="#8bd5b0"/><rect x="872" y="251" width="9" height="71" rx="2" fill="#171d24" stroke="#3b4b59"/><text x="781" y="353" fill="#b0c0cd" font-size="17" font-weight="400">固定显示</text><text x="415" y="431" fill="#8bd5b0" font-size="23" font-weight="600">② 对应通道高亮</text><text x="28" y="477" fill="#b0c0cd" font-size="20" font-weight="400">M = 静音  ·  S = 独奏  ·  筛选只改变显示，不改变试听或导出范围。</text></svg>
