<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="286" viewBox="0 0 1000 286" role="img" aria-labelledby="title description"><title id="title">从 MIDI 到音符盒编曲</title><desc id="description">按这个顺序开始，随时保存 NBSX 继续编辑。。原创操作示意，界面布局作了简化，不是应用截图。</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#8bd5b0" stroke-width="1.5"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#f0c181" stroke-width="1.5"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#91bce4" stroke-width="1.5"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif}</style><rect x="1" y="1" width="998" height="284" rx="16" fill="#171d24" stroke="#3b4b59"/><text x="28" y="45" fill="#edf3f7" font-size="27" font-weight="650">从 MIDI 到音符盒编曲</text><text x="28" y="77" fill="#b0c0cd" font-size="18" font-weight="400">按这个顺序开始，随时保存 NBSX 继续编辑。</text><rect x="28" y="108" width="214" height="153" rx="10" fill="#222c36" stroke="#3b4b59"/><circle cx="53" cy="136" r="16" fill="#8bd5b0"/><text x="47" y="143" fill="#171d24" font-size="20" font-weight="700">1</text><text x="78" y="144" fill="#edf3f7" font-size="25" font-weight="600">导入</text><text x="44" y="188" fill="#8bd5b0" font-size="18" font-weight="400">MIDI / NBS / FLP</text><text x="44" y="227" fill="#b0c0cd" font-size="17" font-weight="400">文件菜单或拖入文件</text><path d="M249 184L263 184" fill="none" stroke="#8bd5b0" stroke-width="3" marker-end="url(#green)"/><rect x="272" y="108" width="214" height="153" rx="10" fill="#222c36" stroke="#3b4b59"/><circle cx="297" cy="136" r="16" fill="#8bd5b0"/><text x="291" y="143" fill="#171d24" font-size="20" font-weight="700">2</text><text x="322" y="144" fill="#edf3f7" font-size="25" font-weight="600">编辑</text><text x="288" y="188" fill="#8bd5b0" font-size="18" font-weight="400">片段 + 钢琴卷帘</text><text x="288" y="227" fill="#b0c0cd" font-size="17" font-weight="400">移动、裁剪、改力度</text><path d="M493 184L507 184" fill="none" stroke="#8bd5b0" stroke-width="3" marker-end="url(#green)"/><rect x="516" y="108" width="214" height="153" rx="10" fill="#222c36" stroke="#3b4b59"/><circle cx="541" cy="136" r="16" fill="#8bd5b0"/><text x="535" y="143" fill="#171d24" font-size="20" font-weight="700">3</text><text x="566" y="144" fill="#edf3f7" font-size="25" font-weight="600">试听</text><text x="532" y="188" fill="#8bd5b0" font-size="18" font-weight="400">混音 + Delay</text><text x="532" y="227" fill="#b0c0cd" font-size="17" font-weight="400">加载本机声音后播放</text><path d="M737 184L751 184" fill="none" stroke="#8bd5b0" stroke-width="3" marker-end="url(#green)"/><rect x="760" y="108" width="214" height="153" rx="10" fill="#222c36" stroke="#3b4b59"/><circle cx="785" cy="136" r="16" fill="#8bd5b0"/><text x="779" y="143" fill="#171d24" font-size="20" font-weight="700">4</text><text x="810" y="144" fill="#edf3f7" font-size="25" font-weight="600">保存 / 导出</text><text x="776" y="188" fill="#8bd5b0" font-size="18" font-weight="400">NBSX 母版 + NBS</text><text x="776" y="227" fill="#b0c0cd" font-size="17" font-weight="400">回声随 NBS 写入</text></svg>
